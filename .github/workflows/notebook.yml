name: Notebook runs top to bottom

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build the notebook from stages/ and run it
        run: python build_notebook.py --execute --output executed_notebook.ipynb

      - name: Upload the executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: |
            executed_notebook.ipynb
            results/
